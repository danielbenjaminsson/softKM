name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
      - feature/unified-app
    tags:
      - 'v*'
  workflow_dispatch:

env:
  HAIKU_HOST: taurus.microgeni.synology.me
  HAIKU_USER: user
  HAIKU_PROJECT_PATH: /Data/Code/Projects/haiku-softKM
  ASUS_HOST: asus.microgeni.synology.me
  ASUS_USER: user
  GITEA_REPO: Microgeni/haiku-softKM
  GITEA_API_URL: https://gitea.microgeni.synology.me/api/v1

jobs:
  deploy:
    name: Build and Deploy to Haiku
    runs-on: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed components
        id: changes
        run: |
          IS_RELEASE="false"
          VERSION=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_RELEASE="true"
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "Release build: version $VERSION"
          fi
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION"       >> $GITHUB_OUTPUT

          if [ "$IS_RELEASE" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "haiku_changed=1" >> $GITHUB_OUTPUT
            echo "macos_changed=1" >> $GITHUB_OUTPUT
            echo "Building all (release or manual dispatch)"
            exit 0
          fi

          # The unified app lives entirely under HaikuOS/. (HaikuClient/
          # is the legacy tree, kept around until we delete it in the
          # next branch step; changes there don't trigger anything.)
          HAIKU_CHANGED=$(git diff --name-only HEAD~1 -- HaikuOS/ 2>/dev/null | wc -l | tr -d ' ')
          MACOS_CHANGED=$(git diff --name-only HEAD~1 -- MacOS/ 2>/dev/null | wc -l | tr -d ' ')
          WORKFLOW_CHANGED=$(git diff --name-only HEAD~1 -- .gitea/workflows/ 2>/dev/null | wc -l | tr -d ' ')

          if [ "$WORKFLOW_CHANGED" -gt 0 ]; then
            HAIKU_CHANGED=1
            MACOS_CHANGED=1
          fi

          echo "haiku_changed=$HAIKU_CHANGED" >> $GITHUB_OUTPUT
          echo "macos_changed=$MACOS_CHANGED" >> $GITHUB_OUTPUT
          echo "Haiku: $HAIKU_CHANGED, MacOS: $MACOS_CHANGED"

      # ====================================================================
      # taurus — softKM (unified Haiku binary, deployed in CLIENT mode)
      # ====================================================================
      # taurus replaces the legacy macOS sender app. The unified softKM
      # binary runs in MODE_CLIENT here: captures local input via the
      # SoftKMClientFilter input_server filter add-on, forwards to the
      # configured server (asus). No server-side device add-ons are
      # installed in client mode.
      - name: Deploy unified softKM (client mode) to taurus
        if: steps.changes.outputs.haiku_changed != '0' && steps.changes.outputs.is_release != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ssh -o StrictHostKeyChecking=no $HAIKU_USER@$HAIKU_HOST \
              BRANCH="$BRANCH" \
              BUILD_NUMBER="$BUILD_NUMBER" \
              ASUS_HOST="$ASUS_HOST" \
              bash <<'ENDSSH'
            set -e
            echo "=== softKM client deploy on taurus: BRANCH=$BRANCH ==="

            PROJECT=/Data/Code/Projects/haiku-softKM
            if [ ! -d "$PROJECT" ]; then
              echo "Project not found at $PROJECT — cloning"
              mkdir -p /Data/Code/Projects
              cd /Data/Code/Projects
              git clone ssh://git@gitea.microgeni.synology.me:2222/Microgeni/haiku-softKM.git haiku-softKM
            fi
            cd "$PROJECT"

            echo "Pulling latest from $BRANCH..."
            git fetch origin
            git checkout -f "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            # ---- Stop any running softKM and the legacy softKMClient.
            #
            # During the migration we may have either name running. Use
            # pidof + roster + ps fallbacks; tolerate empty results
            # (every command substitution gets `|| true` so 'set -e'
            # doesn't abort on no-matches).
            echo "Stopping any running softKM / softKMClient..."
            APP_PIDS="$(pidof softKM 2>/dev/null || true) \
                      $(pidof softKMClient 2>/dev/null || true) \
                      $(roster 2>/dev/null \
                          | grep -E 'application/x-vnd\.softKM(Client)?$' \
                          | awk '{print $1}' || true) \
                      $(ps | grep -E '/softKM(Client)?( |$)' \
                           | grep -v grep | awk '{print $2}' || true)"
            APP_PIDS=$(echo "$APP_PIDS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
            for pid in $APP_PIDS; do
              echo "  kill $pid"
              kill "$pid" 2>/dev/null || true
            done
            sleep 1
            for pid in $APP_PIDS; do
              if kill -0 "$pid" 2>/dev/null; then
                echo "  kill -9 $pid"
                kill -9 "$pid" 2>/dev/null || true
              fi
            done
            sleep 1

            # ---- Build the unified softKM binary ----
            cd "$PROJECT/HaikuOS"
            if [ -f resources/SoftKM.rdef ]; then
              sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" \
                resources/SoftKM.rdef || true
            fi

            rm -rf objects.*
            make
            BINARY=$(find objects.* -name "softKM" -type f 2>/dev/null | head -1)
            if [ -z "$BINARY" ]; then
              echo "ERROR: HaikuOS build failed on taurus — no binary"
              exit 1
            fi
            echo "Built: $BINARY"

            # ---- Build all input_server add-ons; install only the
            #      filter (client mode doesn't use the device add-ons).
            cd addon
            make clean
            make
            FILTER=$(find objects.* -name "SoftKMClientFilter" -type f 2>/dev/null | head -1)
            if [ -z "$FILTER" ]; then
              echo "ERROR: SoftKMClientFilter build failed"
              exit 1
            fi

            mkdir -p ~/config/non-packaged/add-ons/input_server/filters
            cp "$FILTER" ~/config/non-packaged/add-ons/input_server/filters/
            echo "Filter installed: $FILTER"

            # Remove server-side device add-ons if they were installed
            # by an earlier deploy that put taurus into server mode.
            # (Harmless if they weren't there.)
            rm -f ~/config/non-packaged/add-ons/input_server/devices/SoftKMKeyboard
            rm -f ~/config/non-packaged/add-ons/input_server/devices/SoftKMMouse

            cd ..

            # ---- Configure as MODE_CLIENT, pointing at asus ----
            #
            # Run softKM in --configure mode (no GUI) to write a fresh
            # settings file. This is idempotent: if the user later
            # changes settings via the GUI, those win on the next
            # launch. We only force-overwrite mode/host on deploy so
            # taurus comes up in the right role even if a previous
            # test run left it pointed elsewhere.
            "$PROJECT/HaikuOS/$BINARY" --configure \
              --mode=client \
              --host="$ASUS_HOST" \
              --port=31337 \
              --switch-edge=0 \
              --return-edge=1 \
              --dwell=0.3

            # ---- Reload input_server so the new filter binary is
            #      actually in memory (the filter file on disk doesn't
            #      replace the live in-memory copy without a reload).
            INPUT_PID=$(pidof input_server 2>/dev/null || true)
            if [ -n "$INPUT_PID" ]; then
              echo "Reloading input_server (pid $INPUT_PID)..."
              kill -SIGHUP "$INPUT_PID" || true
              sleep 2
            fi

            # ---- Launch ----
            #
            # Install the freshly-built binary to a stable on-disk
            # path and update the MIME database so be_roster->FindApp
            # for 'application/x-vnd.softKM' returns the new binary.
            # Without this, the Deskbar replicant gets loaded from a
            # stale on-disk binary while the new app runs in parallel,
            # and any drift in message constants between the two
            # silently breaks status queries from the tray.
            INSTALL_PATH=/boot/home/softKM
            cp -f "$PROJECT/HaikuOS/$BINARY" "$INSTALL_PATH"
            mimeset -F "$INSTALL_PATH" || true
            echo "Installed $INSTALL_PATH (size $(stat -c%s "$INSTALL_PATH") bytes)"

            # Force Deskbar to drop any cached copy of the replicant
            # add-on. Without this, Deskbar may keep the OLD softKM
            # binary's image mapped in its address space; even after
            # the new app reinstalls the replicant via BDeskbar::AddItem,
            # the on-disk binary read by Deskbar can be stale. Removing
            # the replicant here forces Deskbar to release it.
            desklink --remove=softKM 2>/dev/null || true
            sleep 1

            echo "Launching softKM..."
            nohup "$INSTALL_PATH" > /dev/null 2>&1 &
            disown
            sleep 2
            if pidof softKM >/dev/null 2>&1; then
              echo "softKM is running on taurus (pid $(pidof softKM))"
            else
              echo "WARNING: softKM did not start"
            fi

            echo ""
            echo "=== taurus deployment complete (client mode) ==="
          ENDSSH

      # ====================================================================
      # asus — softKM (unified Haiku binary, deployed in SERVER mode)
      # ====================================================================
      # Disabled while the unified-app branch is still under test.
      # asus keeps running its existing softKM until we explicitly
      # opt back in by removing the branch guard below.
      #
      # The body is functionally complete and ready to enable; just
      # remove the `&& github.ref_name != 'feature/unified-app'` clause
      # when you want to deploy the unified app to asus too.
      - name: Deploy unified softKM (server mode) to asus
        if: |
          steps.changes.outputs.haiku_changed != '0'
          && steps.changes.outputs.is_release != 'true'
          && github.ref_name != 'feature/unified-app'
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ssh -o StrictHostKeyChecking=no $ASUS_USER@$ASUS_HOST \
              BRANCH="$BRANCH" \
              BUILD_NUMBER="$BUILD_NUMBER" \
              bash <<'ENDSSH'
            set -e
            echo "=== softKM server deploy on asus: BRANCH=$BRANCH ==="

            PROJECT=/Data/Code/Projects/haiku-softKM
            if [ ! -d "$PROJECT" ]; then
              mkdir -p /Data/Code/Projects
              cd /Data/Code/Projects
              git clone ssh://git@gitea.microgeni.synology.me:2222/Microgeni/haiku-softKM.git haiku-softKM
            fi
            cd "$PROJECT"

            git fetch origin
            git checkout -f "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            echo "Stopping any running softKM..."
            APP_PIDS="$(pidof softKM 2>/dev/null || true) \
                      $(roster 2>/dev/null \
                          | grep -E 'application/x-vnd\.softKM$' \
                          | awk '{print $1}' || true) \
                      $(ps | grep -E '/softKM( |$)' \
                           | grep -v grep | awk '{print $2}' || true)"
            APP_PIDS=$(echo "$APP_PIDS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
            for pid in $APP_PIDS; do
              kill "$pid" 2>/dev/null || true
            done
            sleep 1
            for pid in $APP_PIDS; do
              kill -9 "$pid" 2>/dev/null || true
            done
            sleep 1

            cd "$PROJECT/HaikuOS"
            if [ -f resources/SoftKM.rdef ]; then
              sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" \
                resources/SoftKM.rdef || true
            fi

            rm -rf objects.*
            make
            BINARY=$(find objects.* -name "softKM" -type f 2>/dev/null | head -1)
            if [ -z "$BINARY" ]; then
              echo "ERROR: HaikuOS build failed on asus — no binary"
              exit 1
            fi
            echo "Built: $BINARY"

            cd addon
            make clean
            make
            KBD=$(find objects.* -name "SoftKMKeyboard" -type f 2>/dev/null | head -1)
            MOUSE=$(find objects.* -name "SoftKMMouse"   -type f 2>/dev/null | head -1)

            mkdir -p ~/config/non-packaged/add-ons/input_server/devices
            [ -n "$KBD"   ] && cp "$KBD"   ~/config/non-packaged/add-ons/input_server/devices/
            [ -n "$MOUSE" ] && cp "$MOUSE" ~/config/non-packaged/add-ons/input_server/devices/

            # Remove the client-mode filter if a previous deploy left it.
            rm -f ~/config/non-packaged/add-ons/input_server/filters/SoftKMClientFilter

            cd ..

            "$PROJECT/HaikuOS/$BINARY" --configure \
              --mode=server \
              --port=31337

            INPUT_PID=$(pidof input_server 2>/dev/null || true)
            if [ -n "$INPUT_PID" ]; then
              kill -SIGHUP "$INPUT_PID" || true
              sleep 2
            fi

            # Install the freshly-built binary to a stable on-disk
            # path. The Deskbar replicant is loaded by Deskbar from
            # whichever file is registered in the MIME database for
            # signature 'application/x-vnd.softKM'. If we leave a
            # stale binary there, Deskbar will load OLD replicant code
            # alongside our NEW running app — which means message
            # constants drift and status queries silently get dropped
            # in the default case. Always overwrite the install path
            # and re-run mimeset so be_roster->FindApp returns the
            # fresh binary.
            INSTALL_PATH=/boot/home/softKM
            cp -f "$PROJECT/HaikuOS/$BINARY" "$INSTALL_PATH"
            mimeset -F "$INSTALL_PATH" || true
            echo "Installed $INSTALL_PATH (size $(stat -c%s "$INSTALL_PATH") bytes)"

            # Force Deskbar to drop any cached copy of the replicant
            # add-on so it reloads from the fresh binary on next add.
            desklink --remove=softKM 2>/dev/null || true
            sleep 1

            echo "Launching softKM..."
            nohup "$INSTALL_PATH" > /dev/null 2>&1 &
            disown
            sleep 2
            if pidof softKM >/dev/null 2>&1; then
              echo "softKM is running on asus (pid $(pidof softKM))"
            else
              echo "WARNING: softKM did not start"
            fi

            echo ""
            echo "=== asus deployment complete (server mode) ==="
          ENDSSH

      # ====================================================================
      # macOS sender app — build, sign, install, launch
      # ====================================================================
      - name: Setup signing keychain
        if: steps.changes.outputs.macos_changed != '0'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-signing-temp"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "softKM2025" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/certificate.p12"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Build macOS app
        if: steps.changes.outputs.macos_changed != '0'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          IS_RELEASE: ${{ steps.changes.outputs.is_release }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          cd MacOS

          if [ "$IS_RELEASE" = "true" ] && [ -n "$VERSION" ]; then
            echo "Building release version: $VERSION (build $BUILD_NUMBER)"
            VERSION_FLAG="MARKETING_VERSION=$VERSION"

            # Reset default host for public release builds
            sed -i '' 's/taurus.microgeni.synology.me/enter computer hostname/' \
              softKM/Settings/SettingsManager.swift || true
          else
            echo "Building dev version (build $BUILD_NUMBER)"
            VERSION_FLAG=""
          fi

          xcodebuild -project softKM.xcodeproj \
            -scheme softKM \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            $VERSION_FLAG \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Developer ID Application: Microgeni hb (Z5DSCKN2W6)" \
            DEVELOPMENT_TEAM="Z5DSCKN2W6" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            clean build

      - name: Install and launch macOS app
        if: steps.changes.outputs.macos_changed != '0' && steps.changes.outputs.is_release != 'true'
        run: |
          APP_PATH="MacOS/build/Build/Products/Release/softKM.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: build output not found at $APP_PATH"
            exit 1
          fi

          pkill -x softKM || true
          sleep 1

          rm -rf /Applications/softKM.app
          ditto "$APP_PATH" /Applications/softKM.app
          codesign -v /Applications/softKM.app && echo "Code signature valid" \
                                                || echo "WARNING: signature invalid"

          open /Applications/softKM.app
          echo "macOS softKM installed and launched"

      # ====================================================================
      # Release-only steps (triggered by tag push refs/tags/v*)
      # ====================================================================
      - name: Create macOS DMG
        if: steps.changes.outputs.is_release == 'true'
        id: macos_dmg
        run: |
          VERSION="${{ steps.changes.outputs.version }}"
          APP_PATH="MacOS/build/Build/Products/Release/softKM.app"
          DMG_NAME="softKM-${VERSION}-macOS.dmg"

          echo "=== Creating DMG: $DMG_NAME ==="

          codesign -vvv --deep --strict "$APP_PATH"

          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          hdiutil create -volname "softKM $VERSION" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

          rm -rf dmg_contents

          codesign --force --sign "Developer ID Application: Microgeni hb (Z5DSCKN2W6)" "$DMG_NAME"
          codesign -vvv "$DMG_NAME"

          echo "DMG created and signed: $DMG_NAME"
          ls -la "$DMG_NAME"

          DMG_SHA256=$(shasum -a 256 "$DMG_NAME" | cut -d' ' -f1)
          echo "dmg_sha256=$DMG_SHA256" >> $GITHUB_OUTPUT
          echo "dmg_path=$DMG_NAME"     >> $GITHUB_OUTPUT
          echo "DMG SHA256: $DMG_SHA256"

      - name: Notarize macOS DMG
        if: steps.changes.outputs.is_release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${{ steps.changes.outputs.version }}"
          DMG_NAME="softKM-${VERSION}-macOS.dmg"

          echo "=== Notarizing $DMG_NAME ==="

          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization succeeded"
          else
            echo "=== Notarization failed, fetching log ==="
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD"
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG_NAME"
          echo "Notarization ticket stapled"

      - name: Build Haiku HPKG
        if: steps.changes.outputs.is_release == 'true'
        id: haiku_hpkg
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          HPKG_NAME="softKM-${VERSION}-haiku-x86_64.hpkg"
          echo "=== Building HPKG: $HPKG_NAME ==="

          ssh -o StrictHostKeyChecking=no $HAIKU_USER@$HAIKU_HOST \
              VERSION="$VERSION" \
              BUILD_NUMBER="$BUILD_NUMBER" \
              HPKG_NAME="$HPKG_NAME" \
              bash <<'ENDSSH'
            set -e
            PROJECT=/Data/Code/Projects/haiku-softKM
            cd "$PROJECT"

            git fetch origin --tags --force
            git checkout -f "v${VERSION}"

            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MIDDLE=$(echo "$VERSION" | cut -d. -f2)
            MINOR=$(echo "$VERSION" | cut -d. -f3)
            MINOR=${MINOR:-0}
            echo "Version: $MAJOR.$MIDDLE.$MINOR (build $BUILD_NUMBER)"

            cd HaikuOS
            sed -i "s/major  = [0-9]*/major  = $MAJOR/"     resources/SoftKM.rdef
            sed -i "s/middle = [0-9]*/middle = $MIDDLE/"    resources/SoftKM.rdef
            sed -i "s/minor  = [0-9]*/minor  = $MINOR/"     resources/SoftKM.rdef
            sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" resources/SoftKM.rdef

            rm -rf objects.*
            make
            BINARY=$(find objects.* -name "softKM" -type f 2>/dev/null | head -1)
            if [ -z "$BINARY" ]; then
              echo "ERROR: HaikuOS build failed"
              exit 1
            fi
            echo "Built: $BINARY"

            cd addon
            rm -rf objects.*
            make
            cd ..

            sed -i "s/^version.*/version\t\t\t${VERSION}-${BUILD_NUMBER}/"   .PackageInfo
            sed -i "s/softKM = .*/softKM = ${VERSION}-${BUILD_NUMBER}/"      .PackageInfo
            sed -i "s/app:softKM = .*/app:softKM = ${VERSION}-${BUILD_NUMBER}/" .PackageInfo

            rm -rf package_temp
            mkdir -p package_temp/apps
            mkdir -p package_temp/add-ons/input_server/devices
            mkdir -p package_temp/add-ons/input_server/filters

            cp "$BINARY" package_temp/apps/

            # Ship ALL three add-ons in the package — the user picks
            # mode in Settings, and at first launch softKM moves the
            # appropriate add-ons into ~/config to activate them.
            # (For now both sets are present in the system tree.)
            KBD=$(find addon/objects.* -name "SoftKMKeyboard"     -type f 2>/dev/null | head -1)
            MOUSE=$(find addon/objects.* -name "SoftKMMouse"       -type f 2>/dev/null | head -1)
            FILTER=$(find addon/objects.* -name "SoftKMClientFilter" -type f 2>/dev/null | head -1)
            [ -n "$KBD"    ] && cp "$KBD"    package_temp/add-ons/input_server/devices/
            [ -n "$MOUSE"  ] && cp "$MOUSE"  package_temp/add-ons/input_server/devices/
            [ -n "$FILTER" ] && cp "$FILTER" package_temp/add-ons/input_server/filters/

            cp .PackageInfo package_temp/

            echo "Package contents:"
            ls -laR package_temp/

            cd package_temp
            package create "../$HPKG_NAME"
            cd ..

            echo "HPKG created: $HPKG_NAME"
            package list "$HPKG_NAME"

            rm -rf package_temp
          ENDSSH

          # Pull HPKG back to runner
          HPKG_NAME="softKM-${VERSION}-haiku-x86_64.hpkg"
          scp -o StrictHostKeyChecking=no \
            "$HAIKU_USER@$HAIKU_HOST:$HAIKU_PROJECT_PATH/HaikuOS/$HPKG_NAME" .

          ls -la "$HPKG_NAME"
          HPKG_SHA256=$(shasum -a 256 "$HPKG_NAME" | cut -d' ' -f1)
          echo "hpkg_sha256=$HPKG_SHA256" >> $GITHUB_OUTPUT
          echo "hpkg_path=$HPKG_NAME"     >> $GITHUB_OUTPUT
          echo "HPKG SHA256: $HPKG_SHA256"

      - name: Publish Gitea release
        if: steps.changes.outputs.is_release == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DMG_SHA256: ${{ steps.macos_dmg.outputs.dmg_sha256 }}
          HPKG_SHA256: ${{ steps.haiku_hpkg.outputs.hpkg_sha256 }}
        run: |
          VERSION="${{ steps.changes.outputs.version }}"
          TAG="v${VERSION}"
          DMG_FILE="softKM-${VERSION}-macOS.dmg"
          HPKG_FILE="softKM-${VERSION}-haiku-x86_64.hpkg"

          echo "=== Publishing Gitea release $TAG ==="

          git fetch --tags --unshallow 2>/dev/null || git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD --no-merges \
              | grep -v "Co-Authored-By" | head -50 > /tmp/commits.txt || true
          else
            git log --pretty=format:"- %s" -20 --no-merges \
              | grep -v "Co-Authored-By" > /tmp/commits.txt || true
          fi
          touch /tmp/commits.txt

          {
            echo "## What's Changed"
            cat /tmp/commits.txt
            echo ""
            echo "## Downloads"
            echo "- **macOS sender**: $DMG_FILE (signed and notarised)"
            echo "- **Haiku (sender or receiver)**: $HPKG_FILE"
            echo ""
            echo "## Checksums (SHA256)"
            echo '```'
            echo "${DMG_SHA256}  $DMG_FILE"
            echo "${HPKG_SHA256}  $HPKG_FILE"
            echo '```'
          } > /tmp/release_body.txt

          EXISTING=$(curl -s -H "Authorization: token $RELEASE_TOKEN" \
            "$GITEA_API_URL/repos/$GITEA_REPO/releases/tags/$TAG")
          EXISTING_ID=$(echo "$EXISTING" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release $EXISTING_ID..."
            curl -s -X DELETE -H "Authorization: token $RELEASE_TOKEN" \
              "$GITEA_API_URL/repos/$GITEA_REPO/releases/$EXISTING_ID"
            sleep 2
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg commit "${{ github.sha }}" \
            --arg name "softKM $VERSION" \
            --arg body "$(cat /tmp/release_body.txt)" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: false, prerelease: false}')

          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$GITEA_API_URL/repos/$GITEA_REPO/releases")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: failed to create release"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi
          echo "Release ID: $RELEASE_ID"

          upload_asset() {
            local file="$1" mime="$2"
            [ ! -f "$file" ] && { echo "Skipping missing asset: $file"; return; }
            echo "Uploading $file..."
            curl -s -X POST \
              -H "Authorization: token $RELEASE_TOKEN" \
              -H "Content-Type: $mime" \
              --data-binary @"$file" \
              "$GITEA_API_URL/repos/$GITEA_REPO/releases/$RELEASE_ID/assets?name=$file"
            echo ""
          }

          upload_asset "$DMG_FILE"  "application/octet-stream"
          upload_asset "$HPKG_FILE" "application/octet-stream"

          {
            [ -f "$DMG_FILE"  ] && echo "${DMG_SHA256}  $DMG_FILE"
            [ -f "$HPKG_FILE" ] && echo "${HPKG_SHA256}  $HPKG_FILE"
          } > SHA256SUMS
          upload_asset SHA256SUMS "text/plain"

          echo "=== Gitea release $TAG published ==="

      - name: Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Ref:          ${{ github.ref_name }}"
          echo "Build:        ${{ github.run_number }}"
          IS_RELEASE="${{ steps.changes.outputs.is_release }}"
          if [ "$IS_RELEASE" = "true" ]; then
            echo "Type:         RELEASE v${{ steps.changes.outputs.version }}"
          else
            echo "Type:         Development build"
          fi
          echo "Haiku:        ${{ steps.changes.outputs.haiku_changed != '0' && 'built' || 'skipped' }}"
          echo "MacOS:        ${{ steps.changes.outputs.macos_changed != '0' && 'built' || 'skipped' }}"
          echo "Status:       ${{ job.status }}"
