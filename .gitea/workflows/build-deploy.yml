name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

env:
  HAIKU_HOST: taurus.microgeni.synology.me
  HAIKU_USER: user
  HAIKU_PROJECT_PATH: /Data/Code/Projects/haiku-softKM
  ASUS_HOST: asus.microgeni.synology.me
  ASUS_USER: user
  GITEA_REPO: Microgeni/haiku-softKM
  GITEA_API_URL: https://gitea.microgeni.synology.me/api/v1

jobs:
  deploy:
    name: Build and Deploy to Haiku
    runs-on: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed components
        id: changes
        run: |
          # Tag push -> release build (always builds everything)
          IS_RELEASE="false"
          VERSION=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_RELEASE="true"
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "Release build: version $VERSION"
          fi
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION"       >> $GITHUB_OUTPUT

          if [ "$IS_RELEASE" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "client_changed=1" >> $GITHUB_OUTPUT
            echo "server_changed=1" >> $GITHUB_OUTPUT
            echo "macos_changed=1"  >> $GITHUB_OUTPUT
            echo "Building all (release or manual dispatch)"
            exit 0
          fi

          CLIENT_CHANGED=$(git diff --name-only HEAD~1 -- HaikuClient/ 2>/dev/null | wc -l | tr -d ' ')
          SERVER_CHANGED=$(git diff --name-only HEAD~1 -- HaikuOS/ 2>/dev/null | wc -l | tr -d ' ')
          MACOS_CHANGED=$(git diff --name-only HEAD~1 -- MacOS/ 2>/dev/null | wc -l | tr -d ' ')
          WORKFLOW_CHANGED=$(git diff --name-only HEAD~1 -- .gitea/workflows/ 2>/dev/null | wc -l | tr -d ' ')

          if [ "$WORKFLOW_CHANGED" -gt 0 ]; then
            CLIENT_CHANGED=1
            SERVER_CHANGED=1
            MACOS_CHANGED=1
          fi

          echo "client_changed=$CLIENT_CHANGED" >> $GITHUB_OUTPUT
          echo "server_changed=$SERVER_CHANGED" >> $GITHUB_OUTPUT
          echo "macos_changed=$MACOS_CHANGED"   >> $GITHUB_OUTPUT
          echo "HaikuClient: $CLIENT_CHANGED, HaikuOS: $SERVER_CHANGED, MacOS: $MACOS_CHANGED"

      - name: Deploy to Haiku
        if: (steps.changes.outputs.client_changed != '0' || steps.changes.outputs.server_changed != '0') && steps.changes.outputs.is_release != 'true'
        env:
          BUILD_CLIENT: ${{ steps.changes.outputs.client_changed }}
          BUILD_SERVER: ${{ steps.changes.outputs.server_changed }}
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ssh -o StrictHostKeyChecking=no $HAIKU_USER@$HAIKU_HOST \
              BUILD_CLIENT="$BUILD_CLIENT" \
              BUILD_SERVER="$BUILD_SERVER" \
              BRANCH="$BRANCH" \
              BUILD_NUMBER="$BUILD_NUMBER" \
              bash <<'ENDSSH'
            set -e
            echo "=== softKM deploy: BRANCH=$BRANCH client=$BUILD_CLIENT server=$BUILD_SERVER ==="

            PROJECT=/Data/Code/Projects/haiku-softKM
            if [ ! -d "$PROJECT" ]; then
              echo "Project not found at $PROJECT — cloning"
              mkdir -p /Data/Code/Projects
              cd /Data/Code/Projects
              git clone ssh://git@gitea.microgeni.synology.me:2222/Microgeni/haiku-softKM.git haiku-softKM
            fi
            cd "$PROJECT"

            echo "Pulling latest from $BRANCH..."
            git fetch origin
            git checkout -f "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            # ---------- HaikuClient (sender) ----------
            if [ "$BUILD_CLIENT" != "0" ]; then
              echo ""
              echo "=== Building HaikuClient ==="

              echo "Stopping any running softKMClient..."
              # ps truncates long paths so 'grep softKMClient' may miss
              # an app launched by absolute path. Use pidof and roster
              # (which queries the registrar by signature) for a reliable
              # match, and fall back to a broad ps grep just in case.
              #
              # Each tool here may exit non-zero on "no match" (pidof, grep),
              # which under set -e would abort the whole script BEFORE we
              # ever assign CLIENT_PIDS. Append `|| true` to every command
              # substitution so an empty result is benign, and protect the
              # final dedup pipeline the same way.
              CLIENT_PIDS="$(pidof softKMClient 2>/dev/null || true) \
                            $(roster 2>/dev/null | grep softKMClient \
                                                 | awk '{print $1}' || true) \
                            $(ps | grep -E 'softKMClient|softkm_client' \
                                 | grep -v grep | awk '{print $2}' || true)"
              CLIENT_PIDS=$(echo "$CLIENT_PIDS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
              for pid in $CLIENT_PIDS; do
                echo "  kill $pid"
                kill "$pid" 2>/dev/null || true
              done
              sleep 1
              # SIGKILL anything still alive
              for pid in $CLIENT_PIDS; do
                if kill -0 "$pid" 2>/dev/null; then
                  echo "  kill -9 $pid (still alive)"
                  kill -9 "$pid" 2>/dev/null || true
                fi
              done
              sleep 1

              cd "$PROJECT/HaikuClient"

              # Bump build number if rdef has internal field
              if [ -f resources/SoftKMClient.rdef ]; then
                sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" resources/SoftKMClient.rdef || true
              fi

              rm -rf objects.*
              make

              CLIENT_BIN=$(find objects.* -name "softKMClient" -type f 2>/dev/null | head -1)
              if [ -z "$CLIENT_BIN" ]; then
                echo "ERROR: HaikuClient build failed — no binary"
                exit 1
              fi
              echo "Built: $CLIENT_BIN"

              echo "Building HaikuClient input_server filter..."
              cd addon
              make clean
              make

              FILTER_ADDON=$(find objects.* -name "SoftKMClientFilter" -type f 2>/dev/null | head -1)
              if [ -n "$FILTER_ADDON" ]; then
                mkdir -p ~/config/non-packaged/add-ons/input_server/filters
                cp "$FILTER_ADDON" ~/config/non-packaged/add-ons/input_server/filters/
                echo "Filter installed: $FILTER_ADDON"
                echo "NOTE: input_server must be restarted to load the updated filter"
              else
                echo "WARNING: filter add-on build produced no output"
              fi
              cd ..

              echo "Launching softKMClient..."
              nohup "$PROJECT/HaikuClient/$CLIENT_BIN" > /dev/null 2>&1 &
              sleep 2
              if pidof softKMClient >/dev/null 2>&1; then
                echo "softKMClient is running (pid $(pidof softKMClient))"
              else
                echo "WARNING: softKMClient did not start"
              fi
            fi

            # ---------- HaikuOS (receiver) ----------
            if [ "$BUILD_SERVER" != "0" ]; then
              echo ""
              echo "=== Building HaikuOS receiver ==="

              echo "Stopping any running softKM..."
              # Need to match 'softKM' but NOT 'softKMClient' — the receiver
              # app's binary is named just 'softKM'. Use exact-match where
              # possible (pidof / roster signature) and a careful grep
              # fallback that excludes softKMClient.
              SERVER_PIDS="$(pidof softKM 2>/dev/null || true) \
                            $(roster 2>/dev/null \
                                | grep -E 'application/x-vnd\.softKM($|[^C])' \
                                | awk '{print $1}' || true) \
                            $(ps | grep -E '/softKM($|[^C])' \
                                 | grep -v grep | awk '{print $2}' || true)"
              SERVER_PIDS=$(echo "$SERVER_PIDS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
              for pid in $SERVER_PIDS; do
                echo "  kill $pid"
                kill "$pid" 2>/dev/null || true
              done
              sleep 1
              for pid in $SERVER_PIDS; do
                if kill -0 "$pid" 2>/dev/null; then
                  echo "  kill -9 $pid (still alive)"
                  kill -9 "$pid" 2>/dev/null || true
                fi
              done
              sleep 1

              cd "$PROJECT/HaikuOS"

              if [ -f resources/SoftKM.rdef ]; then
                sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" resources/SoftKM.rdef || true
              fi

              rm -rf objects.*
              make

              SERVER_BIN=$(find objects.* -name "softKM" -type f 2>/dev/null | head -1)
              if [ -z "$SERVER_BIN" ]; then
                echo "ERROR: HaikuOS build failed — no binary"
                exit 1
              fi
              echo "Built: $SERVER_BIN"

              echo "Building HaikuOS input_server addons..."
              cd addon
              make clean
              make

              KBD_ADDON=$(find objects.* -name "SoftKMKeyboard" -type f 2>/dev/null | head -1)
              MOUSE_ADDON=$(find objects.* -name "SoftKMMouse" -type f 2>/dev/null | head -1)

              mkdir -p ~/config/non-packaged/add-ons/input_server/devices
              [ -n "$KBD_ADDON" ]   && cp "$KBD_ADDON"   ~/config/non-packaged/add-ons/input_server/devices/
              [ -n "$MOUSE_ADDON" ] && cp "$MOUSE_ADDON" ~/config/non-packaged/add-ons/input_server/devices/
              echo "Device addons installed"
              cd ..

              echo "Launching softKM..."
              nohup "$PROJECT/HaikuOS/$SERVER_BIN" > /dev/null 2>&1 &
              sleep 2
              if pidof softKM >/dev/null 2>&1; then
                echo "softKM is running (pid $(pidof softKM))"
              else
                echo "WARNING: softKM did not start"
              fi
            fi

            echo ""
            echo "=== Deployment complete ==="
          ENDSSH

      # ====================================================================
      # asus — HaikuOS receiver deploy
      # ====================================================================
      # asus runs the receiver-side softKM (HaikuOS) and listens on port
      # 31337 for input from the sender-side softKMClient running on
      # taurus. Build/install steps mirror the taurus block but only
      # touch HaikuOS/, not HaikuClient/.
      - name: Deploy receiver to asus
        if: steps.changes.outputs.server_changed != '0' && steps.changes.outputs.is_release != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ssh -o StrictHostKeyChecking=no $ASUS_USER@$ASUS_HOST \
              BRANCH="$BRANCH" \
              BUILD_NUMBER="$BUILD_NUMBER" \
              bash <<'ENDSSH'
            set -e
            echo "=== softKM receiver deploy on asus: BRANCH=$BRANCH ==="

            PROJECT=/Data/Code/Projects/haiku-softKM
            if [ ! -d "$PROJECT" ]; then
              echo "Project not found at $PROJECT — cloning"
              mkdir -p /Data/Code/Projects
              cd /Data/Code/Projects
              git clone ssh://git@gitea.microgeni.synology.me:2222/Microgeni/haiku-softKM.git haiku-softKM
            fi
            cd "$PROJECT"

            echo "Pulling latest from $BRANCH..."
            git fetch origin
            git checkout -f "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            # Stop any running softKM (receiver). Use pidof / roster for
            # reliable matching even when ps truncates absolute paths.
            echo "Stopping any running softKM..."
            SERVER_PIDS="$(pidof softKM 2>/dev/null || true) \
                          $(roster 2>/dev/null \
                              | grep -E 'application/x-vnd\.softKM($|[^C])' \
                              | awk '{print $1}' || true) \
                          $(ps | grep -E '/softKM($|[^C])' \
                               | grep -v grep | awk '{print $2}' || true)"
            SERVER_PIDS=$(echo "$SERVER_PIDS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
            for pid in $SERVER_PIDS; do
              echo "  kill $pid"
              kill "$pid" 2>/dev/null || true
            done
            sleep 1
            for pid in $SERVER_PIDS; do
              if kill -0 "$pid" 2>/dev/null; then
                echo "  kill -9 $pid (still alive)"
                kill -9 "$pid" 2>/dev/null || true
              fi
            done
            sleep 1

            cd "$PROJECT/HaikuOS"
            if [ -f resources/SoftKM.rdef ]; then
              sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" resources/SoftKM.rdef || true
            fi

            rm -rf objects.*
            make

            SERVER_BIN=$(find objects.* -name "softKM" -type f 2>/dev/null | head -1)
            if [ -z "$SERVER_BIN" ]; then
              echo "ERROR: HaikuOS build failed on asus — no binary"
              exit 1
            fi
            echo "Built: $SERVER_BIN"

            echo "Building HaikuOS input_server addons..."
            cd addon
            make clean
            make

            KBD_ADDON=$(find objects.* -name "SoftKMKeyboard" -type f 2>/dev/null | head -1)
            MOUSE_ADDON=$(find objects.* -name "SoftKMMouse"   -type f 2>/dev/null | head -1)

            mkdir -p ~/config/non-packaged/add-ons/input_server/devices
            [ -n "$KBD_ADDON"   ] && cp "$KBD_ADDON"   ~/config/non-packaged/add-ons/input_server/devices/
            [ -n "$MOUSE_ADDON" ] && cp "$MOUSE_ADDON" ~/config/non-packaged/add-ons/input_server/devices/
            echo "Device addons installed on asus"
            cd ..

            echo "Launching softKM..."
            nohup "$PROJECT/HaikuOS/$SERVER_BIN" > /dev/null 2>&1 &
            sleep 2
            if pidof softKM >/dev/null 2>&1; then
              echo "softKM is running on asus (pid $(pidof softKM))"
            else
              echo "WARNING: softKM did not start on asus"
            fi

            echo ""
            echo "=== asus deployment complete ==="
          ENDSSH

      # ====================================================================
      # macOS sender app — build, sign, install, launch
      # ====================================================================
      - name: Setup signing keychain
        if: steps.changes.outputs.macos_changed != '0'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-signing-temp"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "softKM2025" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/certificate.p12"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Build macOS app
        if: steps.changes.outputs.macos_changed != '0'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          IS_RELEASE: ${{ steps.changes.outputs.is_release }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          cd MacOS

          if [ "$IS_RELEASE" = "true" ] && [ -n "$VERSION" ]; then
            echo "Building release version: $VERSION (build $BUILD_NUMBER)"
            VERSION_FLAG="MARKETING_VERSION=$VERSION"

            # Reset default host for public release builds
            sed -i '' 's/taurus.microgeni.synology.me/enter computer hostname/' \
              softKM/Settings/SettingsManager.swift || true
          else
            echo "Building dev version (build $BUILD_NUMBER)"
            VERSION_FLAG=""
          fi

          xcodebuild -project softKM.xcodeproj \
            -scheme softKM \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            $VERSION_FLAG \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Developer ID Application: Microgeni hb (Z5DSCKN2W6)" \
            DEVELOPMENT_TEAM="Z5DSCKN2W6" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            clean build

      - name: Install and launch macOS app
        if: steps.changes.outputs.macos_changed != '0' && steps.changes.outputs.is_release != 'true'
        run: |
          APP_PATH="MacOS/build/Build/Products/Release/softKM.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: build output not found at $APP_PATH"
            exit 1
          fi

          pkill -x softKM || true
          sleep 1

          rm -rf /Applications/softKM.app
          ditto "$APP_PATH" /Applications/softKM.app
          codesign -v /Applications/softKM.app && echo "Code signature valid" \
                                                || echo "WARNING: signature invalid"

          open /Applications/softKM.app
          echo "macOS softKM installed and launched"

      # ====================================================================
      # Release-only steps (triggered by tag push refs/tags/v*)
      # ====================================================================
      - name: Create macOS DMG
        if: steps.changes.outputs.is_release == 'true'
        id: macos_dmg
        run: |
          VERSION="${{ steps.changes.outputs.version }}"
          APP_PATH="MacOS/build/Build/Products/Release/softKM.app"
          DMG_NAME="softKM-${VERSION}-macOS.dmg"

          echo "=== Creating DMG: $DMG_NAME ==="

          # Verify app signature before packaging
          codesign -vvv --deep --strict "$APP_PATH"

          # Stage DMG contents (app + Applications symlink)
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          hdiutil create -volname "softKM $VERSION" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

          rm -rf dmg_contents

          # Sign the DMG itself
          codesign --force --sign "Developer ID Application: Microgeni hb (Z5DSCKN2W6)" "$DMG_NAME"
          codesign -vvv "$DMG_NAME"

          echo "DMG created and signed: $DMG_NAME"
          ls -la "$DMG_NAME"

          DMG_SHA256=$(shasum -a 256 "$DMG_NAME" | cut -d' ' -f1)
          echo "dmg_sha256=$DMG_SHA256" >> $GITHUB_OUTPUT
          echo "dmg_path=$DMG_NAME"     >> $GITHUB_OUTPUT
          echo "DMG SHA256: $DMG_SHA256"

      - name: Notarize macOS DMG
        if: steps.changes.outputs.is_release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${{ steps.changes.outputs.version }}"
          DMG_NAME="softKM-${VERSION}-macOS.dmg"

          echo "=== Notarizing $DMG_NAME ==="

          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization succeeded"
          else
            echo "=== Notarization failed, fetching log ==="
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD"
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG_NAME"
          echo "Notarization ticket stapled"

      - name: Build Haiku HPKG (receiver)
        if: steps.changes.outputs.is_release == 'true'
        id: haiku_hpkg
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          HPKG_NAME="softKM-${VERSION}-haiku-x86_64.hpkg"
          echo "=== Building HPKG: $HPKG_NAME ==="

          ssh -o StrictHostKeyChecking=no $HAIKU_USER@$HAIKU_HOST \
              VERSION="$VERSION" \
              BUILD_NUMBER="$BUILD_NUMBER" \
              HPKG_NAME="$HPKG_NAME" \
              bash <<'ENDSSH'
            set -e
            PROJECT=/Data/Code/Projects/haiku-softKM
            cd "$PROJECT"

            git fetch origin --tags --force
            git checkout -f "v${VERSION}"

            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MIDDLE=$(echo "$VERSION" | cut -d. -f2)
            MINOR=$(echo "$VERSION" | cut -d. -f3)
            MINOR=${MINOR:-0}
            echo "Version: $MAJOR.$MIDDLE.$MINOR (build $BUILD_NUMBER)"

            cd HaikuOS
            sed -i "s/major  = [0-9]*/major  = $MAJOR/"     resources/SoftKM.rdef
            sed -i "s/middle = [0-9]*/middle = $MIDDLE/"    resources/SoftKM.rdef
            sed -i "s/minor  = [0-9]*/minor  = $MINOR/"     resources/SoftKM.rdef
            sed -i "s/internal = [0-9]*/internal = $BUILD_NUMBER/" resources/SoftKM.rdef

            rm -rf objects.*
            make
            BINARY=$(find objects.* -name "softKM" -type f 2>/dev/null | head -1)
            if [ -z "$BINARY" ]; then
              echo "ERROR: HaikuOS build failed"
              exit 1
            fi
            echo "Built: $BINARY"

            cd addon
            rm -rf objects.*
            make
            cd ..

            sed -i "s/^version.*/version\t\t\t${VERSION}-${BUILD_NUMBER}/"   .PackageInfo
            sed -i "s/softKM = .*/softKM = ${VERSION}-${BUILD_NUMBER}/"      .PackageInfo
            sed -i "s/app:softKM = .*/app:softKM = ${VERSION}-${BUILD_NUMBER}/" .PackageInfo

            rm -rf package_temp
            mkdir -p package_temp/apps
            mkdir -p package_temp/add-ons/input_server/devices

            cp "$BINARY" package_temp/apps/

            KBD_ADDON=$(find addon/objects.* -name "SoftKMKeyboard" -type f 2>/dev/null | head -1)
            MOUSE_ADDON=$(find addon/objects.* -name "SoftKMMouse"   -type f 2>/dev/null | head -1)
            [ -n "$KBD_ADDON"   ] && cp "$KBD_ADDON"   package_temp/add-ons/input_server/devices/
            [ -n "$MOUSE_ADDON" ] && cp "$MOUSE_ADDON" package_temp/add-ons/input_server/devices/

            cp .PackageInfo package_temp/

            echo "Package contents:"
            ls -laR package_temp/

            cd package_temp
            package create "../$HPKG_NAME"
            cd ..

            echo "HPKG created: $HPKG_NAME"
            package list "$HPKG_NAME"

            rm -rf package_temp
          ENDSSH

          # Pull HPKG back to runner
          HPKG_NAME="softKM-${VERSION}-haiku-x86_64.hpkg"
          scp -o StrictHostKeyChecking=no \
            "$HAIKU_USER@$HAIKU_HOST:$HAIKU_PROJECT_PATH/HaikuOS/$HPKG_NAME" .

          ls -la "$HPKG_NAME"
          HPKG_SHA256=$(shasum -a 256 "$HPKG_NAME" | cut -d' ' -f1)
          echo "hpkg_sha256=$HPKG_SHA256" >> $GITHUB_OUTPUT
          echo "hpkg_path=$HPKG_NAME"     >> $GITHUB_OUTPUT
          echo "HPKG SHA256: $HPKG_SHA256"

      - name: Publish Gitea release
        if: steps.changes.outputs.is_release == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DMG_SHA256: ${{ steps.macos_dmg.outputs.dmg_sha256 }}
          HPKG_SHA256: ${{ steps.haiku_hpkg.outputs.hpkg_sha256 }}
        run: |
          VERSION="${{ steps.changes.outputs.version }}"
          TAG="v${VERSION}"
          DMG_FILE="softKM-${VERSION}-macOS.dmg"
          HPKG_FILE="softKM-${VERSION}-haiku-x86_64.hpkg"

          echo "=== Publishing Gitea release $TAG ==="

          # Generate release notes from commits since the previous tag
          git fetch --tags --unshallow 2>/dev/null || git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD --no-merges \
              | grep -v "Co-Authored-By" | head -50 > /tmp/commits.txt || true
          else
            git log --pretty=format:"- %s" -20 --no-merges \
              | grep -v "Co-Authored-By" > /tmp/commits.txt || true
          fi
          touch /tmp/commits.txt

          {
            echo "## What's Changed"
            cat /tmp/commits.txt
            echo ""
            echo "## Downloads"
            echo "- **macOS sender**: $DMG_FILE (signed and notarised)"
            echo "- **Haiku receiver**: $HPKG_FILE"
            echo ""
            echo "## Checksums (SHA256)"
            echo '```'
            echo "${DMG_SHA256}  $DMG_FILE"
            echo "${HPKG_SHA256}  $HPKG_FILE"
            echo '```'
          } > /tmp/release_body.txt

          # Delete any existing release for this tag
          EXISTING=$(curl -s -H "Authorization: token $RELEASE_TOKEN" \
            "$GITEA_API_URL/repos/$GITEA_REPO/releases/tags/$TAG")
          EXISTING_ID=$(echo "$EXISTING" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release $EXISTING_ID..."
            curl -s -X DELETE -H "Authorization: token $RELEASE_TOKEN" \
              "$GITEA_API_URL/repos/$GITEA_REPO/releases/$EXISTING_ID"
            sleep 2
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg commit "${{ github.sha }}" \
            --arg name "softKM $VERSION" \
            --arg body "$(cat /tmp/release_body.txt)" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: false, prerelease: false}')

          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$GITEA_API_URL/repos/$GITEA_REPO/releases")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: failed to create release"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi
          echo "Release ID: $RELEASE_ID"

          upload_asset() {
            local file="$1" mime="$2"
            [ ! -f "$file" ] && { echo "Skipping missing asset: $file"; return; }
            echo "Uploading $file..."
            curl -s -X POST \
              -H "Authorization: token $RELEASE_TOKEN" \
              -H "Content-Type: $mime" \
              --data-binary @"$file" \
              "$GITEA_API_URL/repos/$GITEA_REPO/releases/$RELEASE_ID/assets?name=$file"
            echo ""
          }

          upload_asset "$DMG_FILE"  "application/octet-stream"
          upload_asset "$HPKG_FILE" "application/octet-stream"

          # SHA256SUMS
          {
            [ -f "$DMG_FILE"  ] && echo "${DMG_SHA256}  $DMG_FILE"
            [ -f "$HPKG_FILE" ] && echo "${HPKG_SHA256}  $HPKG_FILE"
          } > SHA256SUMS
          upload_asset SHA256SUMS "text/plain"

          echo "=== Gitea release $TAG published ==="

      - name: Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Ref:          ${{ github.ref_name }}"
          echo "Build:        ${{ github.run_number }}"
          IS_RELEASE="${{ steps.changes.outputs.is_release }}"
          if [ "$IS_RELEASE" = "true" ]; then
            echo "Type:         RELEASE v${{ steps.changes.outputs.version }}"
          else
            echo "Type:         Development build"
          fi
          echo "HaikuClient:  ${{ steps.changes.outputs.client_changed != '0' && 'built' || 'skipped' }}"
          echo "HaikuOS:      ${{ steps.changes.outputs.server_changed != '0' && 'built' || 'skipped' }}"
          echo "MacOS:        ${{ steps.changes.outputs.macos_changed  != '0' && 'built' || 'skipped' }}"
          echo "Status:       ${{ job.status }}"
